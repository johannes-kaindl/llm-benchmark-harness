  - id: E5
    category: edit
    title: "edit: Guard in verschachteltem Python-Block (Einrückung)"
    tests: "Einrückungstreue in einer Methode mit Schleife; Verhalten per Assert."
    prompt: >-
      In /work/proj/src/importer.py soll `Importer.process` Zeilen überspringen, deren "id" leer
      ist (None oder leerer String), statt sie zu verarbeiten.
    fixtures:
      /work/proj/src/importer.py: |
        class Importer:
            def __init__(self):
                self.seen = []

            def process(self, rows):
                count = 0
                for row in rows:
                    name = row["name"].strip()
                    self.seen.append((row["id"], name))
                    count += 1
                return count
    preread: [/work/proj/src/importer.py]
    checks:
      - { type: calls, tool: edit, min: 1 }
      - { type: schema_valid }
      - { type: edit_applies, path: /work/proj/src/importer.py }
      - type: edited_python
        path: /work/proj/src/importer.py
        test: |
          imp = Importer()
          rows = [{"id": 1, "name": " a "}, {"id": None, "name": "b"}, {"id": "", "name": "c"},
                  {"id": 4, "name": "d"}]
          assert imp.process(rows) == 2
          assert imp.seen == [(1, "a"), (4, "d")]

  # ------------------------------------------------------------------ L: Langkontext (~50k Token)
