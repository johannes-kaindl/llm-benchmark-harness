  # opencode-Sitzung. Der Vergleich L* vs. Original isoliert den Kontexteffekt; 4bit vs. 8bit bei
  # L* misst, ob Quantisierung unter langem Kontext stärker durchschlägt. Bleibt unter 131k
  # (8bit lädt per JIT mit 131072) inkl. 32k Antwortbudget.
