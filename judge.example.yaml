# Judge-Endpoint für `touchstone judge`. Pluggable: lokal (offline, kostenlos) oder
# Cloud (beste Score-Qualität). Kopiere nach judge.yaml und passe an.
#
# Lokaler Judge (LM Studio, offline) — ein starkes DENSE Modell. KEINE Thinking-Modelle als
# Judge (sie drehen ohne Token-Cap auf einem Call durch → Crash); qwen3.6-27b ist verlässlich.
endpoint:
  base_url: "http://localhost:1234/v1"
  api_key: "not-needed"
model: "qwen/qwen3.6-27b"
temperature: 0.0

# Runaway-Guard (Defaults; bestehende judge.yaml ohne diese Felder verhalten sich identisch):
call_timeout_s: 120          # per-Call-Timeout — fail fast statt ~30 min bei Runaway-Judges
max_consecutive_failures: 3  # Circuit-Breaker: so viele Fehler in Folge brechen den Lauf ab (0 = aus)
max_tokens: null             # optionaler Cap der Judge-Generierung; default aus

# Cloud-Judge (beste Qualität) — z. B. ein OpenAI-kompatibler Anbieter:
# endpoint:
#   base_url: "https://api.example.com/v1"
#   api_key: "${JUDGE_API_KEY}"   # echten Key in judge.yaml, NICHT committen
# model: "<starkes-judge-modell>"
# temperature: 0.0
