# Run on every commit. Keeps the working tree clean without manual ruff/pytest invocations.
#
# Install once:  pre-commit install
# Run manually:  pre-commit run --all-files
# Skip for one commit: git commit --no-verify

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Byte-genaue Artefakte NICHT anfassen (sonst schreibt der Hook Erwartungswerte um):
      #   tests/fixtures|golden — Golden-Files spiegeln die Ausgabe von report.py 1:1; deren
      #     trailing spaces sind Markdown-Zeilenumbrüche in den Ausfüll-Zeilen, kein Dreck.
      #     Ohne dieses Exclude bricht der Hook test_report_md_golden.py (verifiziert).
      #   LICENSE* — Lizenztexte werden wörtlich weitergegeben, nicht normalisiert.
      #   docs/superpowers/ — historische SDD-Artefakte; sie werden nicht rückwirkend umgeschrieben
      #     (dieselbe Begründung, aus der tests/test_doc_links.py sie ausklammert).
      - id: trailing-whitespace
        exclude: ^(tests/(fixtures|golden)/|LICENSE|docs/superpowers/)
      - id: end-of-file-fixer
        exclude: ^(tests/(fixtures|golden)/|LICENSE|docs/superpowers/)
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=2048']  # PLY fixtures + the like
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy-strict
        name: mypy (strict, touchstone/)
        entry: uv run mypy touchstone/
        language: system
        pass_filenames: false
        stages: [pre-push]   # strict type-check on push — keeps the gate from drifting
      - id: pytest-fast
        name: pytest (fast unit tests)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]   # only on push; not on every commit
      - id: readme-lint
        name: README-Lint (readme_lint.py, zentral in _docs)
        entry: python3 /Users/Shared/code/_docs/readme/readme_lint.py .
        language: system
        pass_filenames: false
        always_run: true
        # Seit 2026-07-28 live-blockend (kein `stages: [manual]` mehr): das README erfüllt den
        # Tier `python-cli` (readme_lint.py --strict grün), also darf der Hook Drift aufhalten.
