# Qualitative ND-Eval gegen Ollama (:11434). Schnelles kleines Modell für den ersten Lauf.
# `scenarios`/`context_buckets` sind für `eval` ungenutzt (Pack liefert die Prompts),
# müssen aber valide sein.
endpoint:
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"

machine: "M5-Pro-64GB"
engine: "ollama"
engine_version: "0.20.2"
server_process_match: "ollama"
output_dir: "./runs"
power_check: true

context_buckets: [4096]
scenarios: [bodydouble]
models:
  - { id: "qwen2.5:3b", quant: "n/a", max_tokens_default: 400 }
