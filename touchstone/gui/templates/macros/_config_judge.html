{% if eval_only_bundles %}<p class="muted text-xs">{{ eval_only_bundles|length }} Bundle(s) bereit zum Bewerten.</p>{% endif %}
<div class="card">
  <div class="card-title">Judge starten</div>
  <form method="post" action="/runs/judge" x-data="judgeModelPicker()">
    <div class="form-group">
      <label class="form-label" for="bundle">Bundle (eval-only)</label>
      <select class="form-select" id="bundle" name="bundle">
        {% if bundle %}
        <option value="{{ bundle }}" selected>{{ bundle }}</option>
        {% endif %}
        {% for b in eval_only_bundles %}
        <option value="{{ b }}"{% if b == bundle %} selected{% endif %}>{{ b }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label" for="judge_config_path">Judge-Config</label>
      <select class="form-select" id="judge_config_path" name="judge_config_path"
              x-model="judgeConfig" @change="fetchModels()">
        {% for j in judge_configs %}
        <option value="{{ j }}">{{ j }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label" for="judge_model">Judge-Modell (vom Endpoint)</label>
      <select class="form-select" id="judge_model" name="judge_model" x-model="pick"
              :disabled="models.length === 0">
        <option value="">— Config-Default verwenden —</option>
        <template x-for="mid in models" :key="mid">
          <option :value="mid" x-text="mid"></option>
        </template>
      </select>
      <p class="muted text-xs" x-show="loading" style="margin-top:0.2rem">… Endpoint wird abgefragt</p>
      <p class="muted text-xs" x-show="error" x-text="error" style="color:var(--einschr); margin-top:0.2rem"></p>
    </div>
    <button type="submit" class="btn btn-primary">Judge starten</button>
  </form>
</div>
